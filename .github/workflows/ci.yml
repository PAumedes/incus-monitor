# SPDX-License-Identifier: GPL-2.0-or-later
# Same steps as `make incus-ci` locally and .gitlab-ci.yml: provision, then `make ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      # checkout needs git inside the container to keep file modes (executable scripts).
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision
        run: scripts/ci/provision.sh

      - name: make ci
        run: make ci

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-ubuntu-${{ matrix.ubuntu }}
          path: |
            build/*.zip
            build/*.deb
          if-no-files-found: error

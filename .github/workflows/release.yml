# SPDX-License-Identifier: GPL-2.0-or-later
# Publishes a GitHub release for a tag created by `make release`. Tags with a pre-release suffix
# (v1.0.0-rc.1) become GitHub pre-releases.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Built on the oldest supported series. The .deb is Architecture: all and serves every series.
    container: ubuntu:24.04
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision
        run: scripts/ci/provision.sh

      - name: Tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"

      - name: make ci
        run: make ci

      - name: Release notes
        run: scripts/release.py --notes "$GITHUB_REF_NAME" > build/release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/*.zip
            build/*.deb
            build/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "Incus Monitor $GITHUB_REF_NAME" \
            --notes-file release/release-notes.md \
            --verify-tag "${prerelease[@]}"
